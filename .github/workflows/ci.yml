name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.0.5
    with:
      enable-dependency-submission: true
      enable-summary: true
      enable-sbom-scan: true
      enable-sbom: true
      enable-coverage: true
      enable-audit: false
      otp-version: '28'
      enable-ex-doc: true

  release:
    needs: ci
    if: ${{ github.event_name == 'push' }}
    uses: Taure/erlang-ci/.github/workflows/release.yml@v1
    secrets: inherit
